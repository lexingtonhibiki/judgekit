name: 工单派单
primitive: route
criteria: 判断该求助内容应流转到哪个部门
labels:                       # map 写法：候选→说明（原生 Jev choice criteria / LLM prompt 锚点）
  退款售后: 退货、退款、换货、发票、赔偿
  物流查询: 快递、运单、发货进度、签收
  投诉建议: 对服务态度、商家或平台的不满与举报
  技术故障: APP/网页/支付等功能异常
  咨询其他: 一般性业务咨询
provider: rules
fallback_rules:
  退款售后: [退款, 退货, 换货, 发票, 赔偿]
  物流查询: [物流, 快递, 发货, 催单, 运单, 包裹, 派送]
  投诉建议: [投诉, 举报, 态度, 坑]
  技术故障: [闪退, 报错, 登不上, 崩溃, 无法打开, 卡死]
  咨询其他: [请问, 咨询, 怎么, 什么时候]
