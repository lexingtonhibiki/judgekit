# intent_zh 关键词规则基线 v2（bench 对照锚点，手工维护）
# v2 原则：只留类别的真实特征词（现象/诉求/渠道），不用标签词，也不针对单条题面定制——
# 规则基线因此从 v1 的近满分回落到 75-85% 区间，这是去泄题后的健康水位。
fallback_rules:
  退款售后: [发票, 划痕, 过期, 色差, 瑕疵, 质量问题, 磨脚, 坏了]
  物流查询: [物流, 快递, 发货, 催单, 运单, 包裹, 派送, 清关, 签收, 单号]
  投诉建议: [态度, 纵容, 假货, 敷衍, 市场监管, 占线, 赔偿, 责任]
  技术故障: [打不开, 登不, 卡死, 白屏, 加载, 崩溃, 进度条]
  咨询其他: [请问, 咨询, 怎么, 什么时候]
