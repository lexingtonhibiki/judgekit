# 判官供应商注册表。价格单位：元/1k token；router 免费链/订阅内边际成本按 0 记。
# deepseek 为占位价（按官网调价后请修正）；jev 按决策计费，官方价拿到 early access 后填 per_decision_cost。
providers:
  rules:
    kind: rules
  router-free-auto:
    kind: openai
    base_url: http://127.0.0.1:3456/v1
    model: free-auto
    api_key_env: ROUTER_API_KEY
    api_key_default: sk-local
    price_in_per_1k: 0.0
    price_out_per_1k: 0.0
  router-glm-5.3-flash:
    kind: openai
    base_url: http://127.0.0.1:3456/v1
    model: glm-5.3-flash
    api_key_env: ROUTER_API_KEY
    api_key_default: sk-local
    price_in_per_1k: 0.0
    price_out_per_1k: 0.0
  router-deepseek-flash:
    kind: openai
    base_url: http://127.0.0.1:3456/v1
    model: deepseek-flash
    api_key_env: ROUTER_API_KEY
    api_key_default: sk-local
    price_in_per_1k: 0.0
    price_out_per_1k: 0.0
  router-web-gemini:
    kind: openai
    base_url: http://127.0.0.1:3456/v1
    model: web/gemini-3.8-flash
    api_key_env: ROUTER_API_KEY
    api_key_default: sk-local
    price_in_per_1k: 0.0
    price_out_per_1k: 0.0
  aimlapi-jev:
    kind: openai
    base_url: https://api.aimlapi.com/v1
    model: typesafe/jev
    api_key_env: AIMLAPI_API_KEY
    per_decision_cost: null
