name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev]
      - run: pytest -q
      - name: zero-cost smoke (rules baseline)
        run: python benchmarks/run_bench.py --models rules --limit 4
      - name: Build the distribution wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Installed wheel demo outside the checkout (offline)
        run: python tools/check_wheel.py
